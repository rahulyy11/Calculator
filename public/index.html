
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price Calculator and Contact Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Price Calculator</h1>

  <label for="propertyType">Property type:</label>
  <select id="propertyType">
    <option value="house">House</option>
    <option value="condo">Condo</option>
  </select>

  <br><br>

  <label for="rooms">Number of rooms:</label>
  <input id="rooms" type="number" min="1" value="1">

  <br><br>

  <button id="calculateButton">Calculate price</button>

  <h2 id="result">Your price will appear here.</h2>

  <hr>

  <h1>Contact Us</h1>

  <form id="contactForm">
    <label for="contactName">Name:</label>
    <input
      id="contactName"
      name="name"
      type="text"
      required
      maxlength="100"
    >

    <br><br>

    <label for="contactEmail">Email:</label>
    <input
      id="contactEmail"
      name="email"
      type="email"
      required
      maxlength="254"
    >

    <br><br>

    <label for="contactMessage">Message:</label>
    <textarea
      id="contactMessage"
      name="message"
      required
      maxlength="5000"
      rows="5"
    ></textarea>

    <br><br>

    <button type="submit">Send message</button>
  </form>

  <p id="contactStatus" role="status" aria-live="polite"></p>

  <script src="script.js"></script>
</body>
</html>
